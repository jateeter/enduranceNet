play.http.secret.key = ${?APPLICATION_SECRET}
play.http.secret.key = "changeme_in_production_use_env_var"

play.http.session.secure = false
play.http.session.httpOnly = true

play.filters.enabled += play.filters.cors.CORSFilter
play.filters.cors {
  allowedOrigins = ["http://localhost:3000", "https://endurance.net", "https://www.endurance.net"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization"]
}

slick.dbs.default {
  profile = "slick.jdbc.H2Profile$"
  profile = ${?SLICK_PROFILE}
  db {
    driver = "org.h2.Driver"
    driver = ${?DB_DRIVER}
    url = "jdbc:h2:mem:endurancenet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    url = ${?DATABASE_URL}
    username = "sa"
    username = ${?DB_USER}
    password = ""
    password = ${?DB_PASSWORD}
  }
}

play.evolutions.db.default.autoApply = true
