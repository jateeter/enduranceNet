events {
    worker_processes auto;
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security – hide server version
    server_tokens off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=60r/s;

    # ─── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Allow ACME challenge for Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS main server ───────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # TLS certificates (managed by Certbot / Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

        # Modern TLS settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        # HSTS (1 year, include subdomains, preload)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Other security headers
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;

        # ── API proxy → Scala backend ─────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=40 nodelay;

            proxy_pass         http://backend:9000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Prevent upstream errors leaking server details
            proxy_intercept_errors on;
        }

        # ── Durable legacy media URLs ─────────────────────────────────────────
        location /legacy-media/ {
            alias /var/www/legacy-media/;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── Public legacy entry-point redirects ───────────────────────────────
        location = /index.html { return 301 /; }
        location = /index_content.html { return 301 /; }
        location = /CurrentNews { return 301 /news; }
        location = /CurrentNews/ { return 301 /news; }
        location = /CurrentNews/index.html { return 301 /news; }
        location = /CurrentNews/indexInternal.html { return 301 /news; }
        location = /FeaturedStories { return 301 /featured-stories; }
        location = /FeaturedStories/ { return 301 /featured-stories; }
        location = /FeaturedStories/index.html { return 301 /featured-stories; }
        location = /FeaturedStories/indexInternal.html { return 301 /featured-stories; }
        location = /newsblogs/ { return 301 /news; }
        location = /newsblogs/index.html { return 301 /news; }
        location = /events/ { return 301 /events; }
        location = /events/index.html { return 301 /events; }
        location = /ClassifiedAds { return 301 /community#classifieds; }
        location = /ClassifiedAds/ { return 301 /community#classifieds; }
        location = /ClassifiedAds/index.html { return 301 /community#classifieds; }
        location = /RidecampFriend { return 301 /community#ridecamp; }
        location = /RidecampFriend/ { return 301 /community#ridecamp; }
        location = /RidecampFriend/index.html { return 301 /community#ridecamp; }

        # ── React SPA (frontend container) ────────────────────────────────────
        location / {
            limit_req zone=web burst=120 nodelay;

            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
