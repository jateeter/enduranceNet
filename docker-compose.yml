services:
  # ─── Postgres content store ──────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: endurancenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-endurancenet}
      POSTGRES_USER: ${POSTGRES_USER:-endurancenet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-endurancenet_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Scala Play Framework REST API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: endurancenet-backend
    restart: unless-stopped
    environment:
      APPLICATION_SECRET: ${APPLICATION_SECRET:-changeme_replace_in_production_min32chars}
      SLICK_PROFILE: slick.jdbc.PostgresProfile$
      DB_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-endurancenet}
      DB_USER: ${POSTGRES_USER:-endurancenet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-endurancenet_dev_password}
      JAVA_OPTS: "-Xmx512m -Xms256m -Dplay.http.secret.key=${APPLICATION_SECRET:-changeme_replace_in_production_min32chars}"
    expose:
      - "9000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── React TypeScript SPA ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: endurancenet-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_started

  # ─── Nginx Reverse Proxy (HTTP only – dev/local) ──────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: endurancenet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    networks:
      - internal
      - external
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  postgres-data:
